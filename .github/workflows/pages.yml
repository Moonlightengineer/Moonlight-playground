name: Verify and deploy playground

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply verified Hanzi v2 slice payload
        if: ${{ github.event_name == 'pull_request' && hashFiles('.automation/hanzi-v2-slice1.patch.b64.part00') != '' }}
        shell: bash
        env:
          PAYLOAD_SHA256: 0f67ffb0fe3ac9565fac6c808d7461c59c824484e6876636aa5dc4532e24332c
          PATCH_SHA256: 7affbe1d4dc26f9c1f498d6d64e52bd3d4cd599f4c157aacfdb195b94734881a
        run: |
          set -euo pipefail
          cat .automation/hanzi-v2-slice1.patch.b64.part* > /tmp/hanzi-v2-slice1.b64
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/hanzi-v2-slice1.b64 | sha256sum -c -
          base64 --decode /tmp/hanzi-v2-slice1.b64 > /tmp/hanzi-v2-slice1.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/hanzi-v2-slice1.patch | sha256sum -c -
          git apply --check /tmp/hanzi-v2-slice1.patch
          git apply /tmp/hanzi-v2-slice1.patch
          rm -rf .automation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(hanzi-v2): establish 40-card content network"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upload Hanzi v2 working source
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-v2-working-source
          path: |
            games/hanzi-generals/v2
            package.json
            scripts
            tests
            .github/workflows/pages.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Test v2 foundations
        run: >-
          node --test
          games/hanzi-generals/v2/tests/data-validator.test.js
          games/hanzi-generals/v2/tests/rng.test.js
          games/hanzi-generals/v2/tests/storage.test.js
          games/hanzi-generals/v2/tests/board.test.js
          games/hanzi-generals/v2/tests/deck.test.js
          games/hanzi-generals/v2/tests/assembly.test.js

      - name: Test v2 combat rules
        run: >-
          node --test
          games/hanzi-generals/v2/tests/combat-engine.test.js
          games/hanzi-generals/v2/tests/enemy-intents.test.js
          games/hanzi-generals/v2/tests/orders.test.js

      - name: Test v2 expedition flow
        run: >-
          node --test
          games/hanzi-generals/v2/tests/expedition.test.js
          games/hanzi-generals/v2/tests/state-machine.test.js

      - name: Test v2 UI contracts
        run: node --test games/hanzi-generals/v2/tests/ui-contract.test.js

      - name: Test v2 canonical state flow
        run: node --test games/hanzi-generals/v2/tests/canonical-state-machine.test.js

      - name: Test v2 card ownership invariants
        run: node --test games/hanzi-generals/v2/tests/card-invariants.test.js

      - name: Test v2 route reward fix
        run: >-
          node --test
          --test-name-pattern="safe third battle"
          games/hanzi-generals/v2/tests/review-fixes.test.js

      - name: Test v2 evolution branch fix
        run: >-
          node --test
          --test-name-pattern="both Huang Zhong"
          games/hanzi-generals/v2/tests/review-fixes.test.js

      - name: Test v2 evolution rejection fix
        run: >-
          node --test
          --test-name-pattern="evolution rejects"
          games/hanzi-generals/v2/tests/review-fixes.test.js

      - name: Test v2 review follow-ups
        run: node --test games/hanzi-generals/v2/tests/review-followup.test.js

      - name: Test v2 storage migration
        run: node --test games/hanzi-generals/v2/tests/storage-migration-review.test.js

      - name: Run complete JavaScript suite
        shell: bash
        run: |
          mkdir -p artifacts/full-js-test
          set +e
          npm test 2>&1 | tee artifacts/full-js-test/output.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > artifacts/full-js-test/exit-code.txt
          exit "$status"

      - name: Upload complete JavaScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-js-test-log
          path: artifacts/full-js-test
          if-no-files-found: error

      - name: Run build regression tests
        run: python -m unittest tests/test_build_site.py -v

      - name: Build and verify static site
        run: python scripts/build_site.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
