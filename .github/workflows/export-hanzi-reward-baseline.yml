name: Export Hanzi reward baseline

on:
  push:
    branches:
      - feature/hanzi-v2-gameplay-economy-clarity

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hanzi-v2-gameplay-economy-clarity
          fetch-depth: 0

      - name: Upload exact branch source
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-reward-baseline
          path: |
            games/hanzi-generals/v2
            package.json
            scripts
          if-no-files-found: error
          retention-days: 2

      - name: Remove exporter
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-hanzi-reward-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(hanzi-v2): remove source exporter"
          git push origin HEAD:feature/hanzi-v2-gameplay-economy-clarity
