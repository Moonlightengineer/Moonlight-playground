name: Apply Hanzi recipe codex slice

on:
  push:
    branches:
      - feature/hanzi-v2-gameplay-economy-clarity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hanzi-v2-gameplay-economy-clarity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply verified codex slice and test
        shell: bash
        run: |
          set -euo pipefail
          for patch in .automation/codex-*.patch; do git apply --check "$patch"; done
          for patch in .automation/codex-*.patch; do git apply "$patch"; done
          rm -rf .automation
          rm -f .github/workflows/apply-hanzi-codex.yml
          node --test \
            games/hanzi-generals/v2/tests/recipe-codex.test.js \
            games/hanzi-generals/v2/tests/codex-profile.test.js \
            games/hanzi-generals/v2/tests/app-controller.test.js \
            games/hanzi-generals/v2/tests/storage.test.js \
            games/hanzi-generals/v2/tests/view-model.test.js
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(hanzi-v2): add persistent recipe codex"
          git push origin HEAD:feature/hanzi-v2-gameplay-economy-clarity
