name: Apply Hanzi deck count slice

on:
  push:
    branches:
      - feature/hanzi-v2-gameplay-economy-clarity

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.automation/deck-zone-counts.patch') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hanzi-v2-gameplay-economy-clarity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply verified slice and test
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .automation/deck-zone-counts.patch
          git apply .automation/deck-zone-counts.patch
          rm -rf .automation
          rm -f .tmp-ignore
          rm -f .github/workflows/apply-hanzi-deck-counts.yml
          node --test \
            games/hanzi-generals/v2/tests/deck-zone-counts.test.js \
            games/hanzi-generals/v2/tests/view-model.test.js
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(hanzi-v2): expose canonical deck zone counts"
          git push origin HEAD:feature/hanzi-v2-gameplay-economy-clarity
