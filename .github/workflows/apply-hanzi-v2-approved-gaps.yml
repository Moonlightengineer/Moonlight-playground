name: Apply Hanzi v2 approved First Playable gaps

on:
  push:
    branches:
      - feature/hanzi-v2-gameplay-economy-clarity

permissions:
  contents: write

concurrency:
  group: hanzi-v2-approved-gaps-applier
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hanzi-v2-gameplay-economy-clarity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply approved fixes, verify, and self-clean
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH='feature/hanzi-v2-gameplay-economy-clarity'
          DIAGNOSTIC='.automation/apply-diagnostic.txt'

          capture_failure() {
            local status=$?
            local failed_command=${BASH_COMMAND:-unknown}
            local failed_line=${BASH_LINENO[0]:-unknown}
            trap - ERR
            set +e
            mkdir -p .automation
            {
              echo 'HANZI_V2_APPLIER_FAILED'
              echo "exit_status=${status}"
              echo "line=${failed_line}"
              echo "command=${failed_command}"
              echo
              echo '--- git status ---'
              git status --short
              for log in /tmp/hanzi-apply.log /tmp/hanzi-focused.log /tmp/hanzi-full.log /tmp/hanzi-build.log; do
                if [[ -f "$log" ]]; then
                  echo
                  echo "--- ${log} ---"
                  cat "$log"
                fi
              done
            } > "$DIAGNOSTIC"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$DIAGNOSTIC"
            git commit -m 'chore(hanzi-v2): capture approved-gap applier diagnostic' || true
            git push origin "HEAD:${BRANCH}" || true
            exit "$status"
          }
          trap capture_failure ERR

          python - <<'PY'
          from pathlib import Path

          path = Path('.automation/apply-hanzi-v2-approved-gaps.py')
          text = path.read_text(encoding='utf-8')
          old = r'''replace_regex(
              state_path,
              r"import \{\n  eligibleEvolutionGenerals,\n\} from '../expedition/evolution-eligibility.js';\n",
              '',
          )'''
          new = r'''replace_once(
              state_path,
              "import { eligibleEvolutionGenerals } from '../expedition/evolution-eligibility.js';\n",
              '',
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'applier import matcher count was {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python -u .automation/apply-hanzi-v2-approved-gaps.py 2>&1 | tee /tmp/hanzi-apply.log

          # Keep rendering on canonical simulated seconds. Legacy counters are
          # converted once by normalizeGameState, never interpreted by the UI.
          python - <<'PY'
          from pathlib import Path
          import re

          view_path = Path('games/hanzi-generals/v2/src/ui/view-model.js')
          view = view_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"  const focusSeconds = game\.combat\.focus\?\.remainingSeconds\n"
              r"\s+\?\? Math\.min\(6, \(game\.combat\.focus\?\.remainingFriendlyTurns \?\? 0\) \* 2\);\n"
              r"\s+const fortifySeconds = game\.combat\.fortify\?\.remainingSeconds\n"
              r"\s+\?\? Math\.min\(6, \(game\.combat\.fortify\?\.remainingEnemyTurns \?\? 0\) \* 3\);\n"
              r"\s+const assaultSeconds = game\.combat\.assault\?\.remainingSeconds\n"
              r"\s+\?\? Math\.min\(6, \(game\.combat\.assault\?\.remainingFriendlyTurns \?\? 0\) \* 2\);"
          )
          replacement = (
              "  const focusSeconds = game.combat.focus?.remainingSeconds ?? 0;\n"
              "  const fortifySeconds = game.combat.fortify?.remainingSeconds ?? 0;\n"
              "  const assaultSeconds = game.combat.assault?.remainingSeconds ?? 0;"
          )
          view, count = pattern.subn(replacement, view, count=1)
          if count != 1:
              raise SystemExit(f'view-model canonical-seconds matcher count was {count}, expected 1')
          view_path.write_text(view, encoding='utf-8')

          test_path = Path('games/hanzi-generals/v2/tests/view-model.test.js')
          test = test_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "focus: { enemyId: 'enemy-1', remainingFriendlyTurns: 2 },",
                  "focus: { enemyId: 'enemy-1', remainingSeconds: 2, damageBonus: 0.2 },",
              ),
              (
                  "fortify: { lane: 0, remainingEnemyTurns: 1 },",
                  "fortify: { lane: 0, remainingSeconds: 1, damageReduction: 0.35 },\n      assault: null,",
              ),
          ]
          for old, new in replacements:
              if test.count(old) != 1:
                  raise SystemExit(f'view-model test field matcher count was {test.count(old)}, expected 1: {old}')
              test = test.replace(old, new, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          node --test \
            games/hanzi-generals/v2/tests/combat-orders-v2.test.js \
            games/hanzi-generals/v2/tests/final-battle-reward-boundary.test.js \
            games/hanzi-generals/v2/tests/result-summary-v2.test.js \
            games/hanzi-generals/v2/tests/orders.test.js \
            games/hanzi-generals/v2/tests/combat-engine.test.js \
            games/hanzi-generals/v2/tests/selectors.test.js \
            games/hanzi-generals/v2/tests/view-model.test.js \
            games/hanzi-generals/v2/tests/app-boundary.test.js \
            games/hanzi-generals/v2/tests/ui-contract.test.js \
            2>&1 | tee /tmp/hanzi-focused.log

          npm test 2>&1 | tee /tmp/hanzi-full.log
          python scripts/build_site.py 2>&1 | tee /tmp/hanzi-build.log
          grep -Fq 'SITE_VERIFY_OK' /tmp/hanzi-build.log
          node --check scripts/hanzi_v2_first_playable.mjs
          node --check scripts/hanzi_v2_browser_ui_regressions.mjs
          node --check scripts/hanzi_v2_reward_target_playtest.mjs
          node --check scripts/hanzi_v2_corrupt_save_playtest.mjs

          rm -rf .automation
          rm -f .github/workflows/apply-hanzi-v2-approved-gaps.yml
          test ! -e .automation
          test ! -e .github/workflows/apply-hanzi-v2-approved-gaps.yml
          git diff --check

          trap - ERR
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(hanzi-v2): implement approved rewards and military orders'
          git push origin "HEAD:${BRANCH}"
