name: Restore Hanzi v2 app shell safely

on:
  push:
    branches:
      - feature/hanzi-v2-gameplay-economy-clarity

permissions:
  contents: write

concurrency:
  group: hanzi-v2-app-restorer
  cancel-in-progress: false

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hanzi-v2-gameplay-economy-clarity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore verified app shell, apply only approved feedback change, verify, and self-clean
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH='feature/hanzi-v2-gameplay-economy-clarity'
          APP='games/hanzi-generals/v2/src/app.js'
          BASE='30dd1440b59254874ea1cbe334924df4ee4ba62a'

          git cat-file -e "${BASE}^{commit}"
          git show "${BASE}:${APP}" > "${APP}"

          python - <<'PY'
          from pathlib import Path

          path = Path('games/hanzi-generals/v2/src/app.js')
          text = path.read_text(encoding='utf-8')
          old = """    ORDER_QUEUED: '變陣已下令，兩名武將會交換位置。',
              UNITS_SWAPPED: '兩名武將已完成換位。',
              FOCUS_ORDERED: `集火已生效，持續 ${important.payload?.turns ?? 3} 輪。`,
              FORTIFY_ORDERED: `第 ${(important.payload?.lane ?? 0) + 1} 路已堅守，持續 ${important.payload?.turns ?? 2} 輪。`,
          """
          new = """    FOCUS_ORDERED: `集火已生效，持續 ${important.payload?.durationSeconds ?? 6} 秒。`,
              FORTIFY_ORDERED: `第 ${(important.payload?.lane ?? 0) + 1} 路已固守，持續 ${important.payload?.durationSeconds ?? 6} 秒。`,
              ASSAULT_ORDERED: `第 ${(important.payload?.lane ?? 0) + 1} 路已急攻，持續 ${important.payload?.durationSeconds ?? 6} 秒。`,
          """
          if text.count(old) != 1:
              raise SystemExit(f'approved feedback block count was {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          grep -Fq '清除目前遠征進度並重新開始' "$APP"
          grep -Fq "UI_CLEAR_ALL_V2_DATA" "$APP"
          grep -Fq "document.addEventListener('keydown'" "$APP"
          grep -Fq 'ASSAULT_ORDERED' "$APP"
          ! grep -Fq 'ORDER_QUEUED' "$APP"
          ! grep -Fq 'UNITS_SWAPPED' "$APP"

          node --test \
            games/hanzi-generals/v2/tests/app-boundary.test.js \
            games/hanzi-generals/v2/tests/ui-contract.test.js
          npm test
          python scripts/build_site.py | tee /tmp/hanzi-build.log
          grep -Fq 'SITE_VERIFY_OK' /tmp/hanzi-build.log

          rm -f .automation/restore-hanzi-v2-app.txt
          rmdir .automation 2>/dev/null || true
          rm -f .github/workflows/restore-hanzi-v2-app.yml
          test ! -e .automation/restore-hanzi-v2-app.txt
          test ! -e .github/workflows/restore-hanzi-v2-app.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(hanzi-v2): restore complete app shell and order feedback'
          git push origin "HEAD:${BRANCH}"
