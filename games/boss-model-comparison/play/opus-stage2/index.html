<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>裂甲守衛</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script type="module" crossorigin src="./assets/index-Ccc9WRz9.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C-ql9nlT.css">
  </head>
  <body>
    <div id="safe-probe"></div>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="topbar">
        <div class="boss-row">
          <span class="boss-name">裂甲守衛<b id="bossPhase" class="phase">Ⅰ</b></span>
          <div class="bar boss-bar" id="bossBar">
            <div class="under" id="bossUnder"></div>
            <div class="lag" id="bossLag"></div>
            <div class="fill" id="bossFill"></div>
            <span class="num" id="bossNum">1800</span>
          </div>
          <span class="bars" id="bossBars">×3</span>
        </div>
        <div class="player-row">
          <svg class="hp-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 2.5 3v4.2C2.5 10.8 5 13.6 8 15c3-1.4 5.5-4.2 5.5-7.8V3z" /></svg>
          <div class="bar hp-bar"><div class="fill" id="hpFill"></div><span class="num" id="hpNum">100</span></div>
          <div class="bar st-bar"><div class="fill" id="stFill"></div></div>
          <div class="charge" aria-label="蓄力"><i id="pip1"></i><i id="pip2"></i></div>
        </div>
        <button id="pauseBtn" class="icon-btn" aria-label="暫停"><span></span><span></span></button>
      </div>
      <div id="panel">
        <div id="base"></div>
        <div id="ring">
          <div id="rimMark"></div>
          <div id="dot"></div>
        </div>
        <button class="skill" id="skDash" data-k="dash" aria-label="破風突刺">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 26 22 10l2-6 2 2-6 2L8 28z" /><path class="ln" d="M4 18h7M9 23H3M14 28v-5" /></svg>
          <span class="nm">突刺</span><span class="cd"></span><span class="cdn"></span>
        </button>
        <button class="skill" id="skSpin" data-k="spin" aria-label="旋風斬">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path class="ln" d="M16 5a11 11 0 1 1-10.4 7.4" /><path class="ln" d="M16 10a6 6 0 1 1-5.7 4" /><path d="m3 9 4.5 4.2L9.4 7.3z" /></svg>
          <span class="nm">旋風</span><span class="cd"></span><span class="cdn"></span>
        </button>
        <button class="skill" id="skHeal" data-k="heal" aria-label="回復脈衝">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z" /></svg>
          <span class="nm">回復</span><span class="cd"></span><span class="cdn"></span>
        </button>
      </div>
      <div id="flash"></div>
      <div id="screenTitle" class="screen">
        <h1>裂甲守衛</h1>
        <button id="startBtn" class="btn">開始</button>
      </div>
      <div id="screenPause" class="screen hidden">
        <h2>暫停</h2>
        <button id="resumeBtn" class="btn">繼續</button>
        <button id="retryBtn2" class="btn ghost">重試</button>
        <button id="muteBtn" class="btn ghost">音效：開</button>
      </div>
      <div id="screenResult" class="screen hidden">
        <h2 id="resultTitle">勝利</h2>
        <p id="resultTime">00:00.0</p>
        <button id="retryBtn" class="btn">重試</button>
      </div>
      <div id="screenSmall" class="screen hidden"><p>請放大視窗</p></div>
      <pre id="debug" class="hidden"></pre>
    </div>
  </body>
</html>
